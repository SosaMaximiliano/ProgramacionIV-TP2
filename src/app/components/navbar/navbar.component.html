<nav class="site-nav">
  <div class="nav-inner">
    <a class="brand" [routerLink]="usuarioService.usuarioActual() ? '/publicaciones' : '/login'">
      <span class="brand-mark">C</span>
      <span>CaraLibro</span>
    </a>

    <div class="nav-links">
      @if (usuarioService.usuarioActual()) {
        <a class="nav-link" routerLink="/publicaciones">Publicaciones</a>
        <a class="nav-link" routerLink="/publicaciones/nueva">Nueva</a>
      } @else {
        <a class="nav-link" routerLink="/login">Ingresar</a>
        <a class="nav-link nav-cta" routerLink="/registro">Crear cuenta</a>
      }
    </div>

    @if (usuarioService.usuarioActual(); as usuario) {
      <div class="nav-account">
        <a class="nav-user" routerLink="/mi-perfil" aria-label="Ir a mi perfil">
          @if (usuario.imagenPerfil; as imagen) {
            <img class="nav-avatar" [src]="imagen" alt="" />
          } @else {
            <span class="nav-avatar nav-avatar--placeholder" aria-hidden="true">
              {{ usuario.usuario.charAt(0).toUpperCase() }}
            </span>
          }
          <span>@{{ usuario.usuario }}</span>
        </a>
        <button class="nav-link nav-logout" type="button" (click)="cerrarSesion()">Salir</button>
      </div>
    }
  </div>
</nav>
